services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - API_PRIVATE_ADDRESS=${API_PRIVATE_ADDRESS:-api:5284}
      - API_PUBLIC_ADDRESS=${API_PUBLIC_ADDRESS:-localhost:5284}

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    volumes:
      - ./api:/src
      - nuget_packages:/root/.nuget/packages
    ports:
      - "${API_PORT:-5284}:${API_PORT:-5284}"
    environment:
      - API_PORT=${API_PORT:-5284}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_DB=${POSTGRES_DB}
      - DATABASE_ADDRESS=${DATABASE_ADDRESS:-db}

  db:
    image: postgres
    # set shared memory limit when using docker compose
    shm_size: 128mb
    ports:
    - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}

volumes:
  frontend_node_modules:
  nuget_packages:
